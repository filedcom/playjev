name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'filedcom/playjev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.15.0

      - name: Detect version update
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          version=$(node -p 'require("./package.json").version')
          lock_version=$(node -p 'require("./package-lock.json").packages[""].version')
          if [ "$version" != "$lock_version" ]; then
            echo "package.json ($version) and package-lock.json ($lock_version) versions differ" >&2
            exit 1
          fi

          changed=true
          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "$BEFORE_SHA:package.json" | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version))')
            if [ "$version" = "$previous" ]; then
              changed=false
            fi
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Validate source
        if: steps.version.outputs.changed == 'true'
        run: npm run validate

      - name: Inspect package contents
        if: steps.version.outputs.changed == 'true'
        run: npm pack --dry-run

      - name: Check registry and release state
        if: steps.version.outputs.changed == 'true'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package_name=$(node -p 'require("./package.json").name')
          if npm view "$package_name@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub Release
        if: steps.version.outputs.changed == 'true' && steps.state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PlayJev $TAG" \
            --generate-notes \
            --draft

      - name: Publish package to npm
        if: steps.version.outputs.changed == 'true' && steps.state.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          package_name=$(node -p 'require("./package.json").name')
          if ! npm view "$package_name" name >/dev/null 2>&1 && [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "The first npm publication requires the NPM_TOKEN repository secret." >&2
            echo "After the first publish, configure npm trusted publishing for filedcom/playjev and release.yml." >&2
            exit 1
          fi

          npm publish --access public --provenance

      - name: Verify npm publication
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          package_name=$(node -p 'require("./package.json").name')
          for attempt in {1..12}; do
            published=$(npm view "$package_name@$VERSION" version 2>/dev/null || true)
            if [ "$published" = "$VERSION" ]; then
              exit 0
            fi
            sleep 5
          done

          echo "npm did not report $package_name@$VERSION after publication" >&2
          exit 1

      - name: Publish GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          is_draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$is_draft" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
